aid: essential-ai
name: Essential AI
description: >-
  Essential AI is a San Francisco artificial-intelligence research company founded in 2023 by Ashish
  Vaswani and Niki Parmar, two co-authors of the 2017 "Attention Is All You Need" transformer paper.
  The company builds open-source models, datasets, and training infrastructure to keep frontier AI
  capability in the open rather than behind closed platforms. Its flagship release is the Rnj-1
  family — 8B-parameter dense base and instruction-tuned models with a 32K context window, trained
  from scratch and tuned for code generation, STEM and mathematical reasoning, and agentic tool use,
  published under Apache 2.0. Essential AI also publishes Essential-Web v1.0, a large document-level
  web dataset organized by a twelve-category taxonomy, the EAI taxonomy classifier models and
  domain-filtered corpora, and research on the Muon optimizer, grokking, reflection, long-context
  perplexity, and large-scale training infrastructure. Distribution is through Hugging Face, GitHub,
  a Homebrew cask for the RNJ macOS desktop app, and third-party inference platforms (Together AI,
  OpenRouter, Ollama, LM Studio). As of this profile Essential AI operates no first-party public
  HTTP API, developer portal, or machine-readable API contract — its public interface is open model
  weights, datasets, and research code.
